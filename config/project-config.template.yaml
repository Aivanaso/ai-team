# ai-team Project Configuration — Annotated Illustration
#
# A fully-annotated illustration of every .ai-team/config.yaml key, not
# organic-scout's literal bootstrap output. Scout (bootstrap mode) writes
# `project`, `stack`, `conventions`, `structure`, `architecture`, plus the
# mandatory `commit_strategy` (default auto) the first time the orchestrator
# runs in a project with no config.yaml yet — there is no separate init
# command in the organic route. The remaining keys below (`strict_tdd`,
# `test_commands`, `review_gates`, `model_overrides`, `rules`, `retro`) are
# optional and safe-absent: add them by hand, or accept them via the orchestrator's
# Config Refresh Check. Canonical annotated source (same key set):
# domain/skills/organic-scout/references/config-template.md.

project:
  name: "{project-name}"          # From package.json, composer.json, or directory name
  type: "{app|library|monorepo}"  # Project type
  description: ""                 # Optional: one-line project description

stack:
  languages:
    - name: "{language}"          # e.g., typescript, php, python, go, rust
      version: "{version}"       # e.g., "5.x", "8.3"
  frameworks:
    - name: "{framework}"        # e.g., react, next, symfony, laravel, nestjs
      version: "{version}"
  testing:
    - name: "{test-framework}"   # e.g., vitest, jest, phpunit, playwright
  styling:
    - name: "{css-framework}"    # e.g., tailwind, styled-components
      version: "{version}"
  package_manager: "{manager}"   # e.g., pnpm, yarn, npm, bun, composer

conventions:
  # Detected from config files (tsconfig, eslint, prettier, etc.)
  # Examples:
  # - "strict TypeScript (strict: true)"
  # - "ESM modules only"
  # - "path aliases via @/"
  # - "conventional commits"

commit_strategy: auto  # orchestrator's own commit-creation step: auto = commits at each objective's
                       # close without pausing; manual = presents the staged file set and waits for
                       # user confirmation before committing (orchestrator-protocol.md -> "Commit creation")

# strict_tdd: true
#   Optional, safe-absent default: false. The orchestrator appends the
#   STRICT TDD MODE directive to organic-implementer delegations only when three
#   conditions hold together: strict_tdd: true, test_commands.unit is declared
#   below, and the objective changes behavior in a testable artifact the
#   declared runner can exercise (never prose/docs/config/templates/skill
#   definitions). strict_tdd: true with test_commands.unit absent sends no
#   directive -- the orchestrator tells the user and records the gap in the
#   Brief File, never inventing a runner command. organic-implementer then
#   returns tdd_cycles evidence for each red -> green cycle
#   (red -> green -> triangulate -> refactor).

# test_commands:
#   unit: "{command}"       # e.g. "npm test" | "pytest" | "phpunit"
#   security: "{command}"   # e.g. "npm audit" | "composer audit"
#   Optional. See domain/skills/organic-scout/references/config-template.md for full semantics.

# review_gates:
#   - name: "{gate-id}"      # e.g. coverage, migration-lint
#     command: "{command}"   # e.g. "npm run coverage -- --min 80"; exit 0 = pass. Threshold lives
#                             # inside the command / project config, not in this key.
#     blocking: true          # optional, default true
#   Optional, safe-absent. Objective review gates executed by organic-reviewer (verification
#   lens). See config/schema.yaml for full semantics.

# retro: on-signal
#   Optional, safe-absent default: on-signal. always | on-signal | off — controls whether the
#   orchestrator delegates organic-retro when a task's Brief File flips to status: done. See
#   domain/skills/organic-scout/references/config-template.md for full semantics.

structure:
  source: "{src-dir}/"           # e.g., src/, app/, lib/
  tests: "{test-pattern}"        # e.g., src/**/*.test.ts, tests/
  components: "{components-dir}" # e.g., src/components/
  # Add more as needed:
  # api: "src/api/"
  # pages: "src/app/"
  # styles: "src/styles/"

architecture:
  style: "{style}"               # ddd | hexagonal | layered | mvc | modular | unknown
  layers: []                     # Detected logical layers with their paths
    # - name: "{layer}"          # e.g., domain, application, infrastructure, presentation
    #   path: "{glob-pattern}"   # e.g., src/*/domain/
  bounded_contexts: []           # DDD bounded contexts or module boundaries
    # - name: "{context}"        # e.g., orders, customers, auth
    #   path: "{path}"           # e.g., src/orders/
  patterns: []                   # Architectural patterns detected
    # Examples: cqrs, event-sourcing, repository-pattern, mediator,
    #           event-driven, service-layer, active-record

# Model routing overrides (optional)
#
# Override the default model per delegated worker, for cost control or
# experimentation. Values: any model alias your adapter recognises (e.g.
# sonnet, opus, haiku). Defaults and rationale: see
# domain/skills/_shared/orchestrator-protocol.md -> "Model Routing".
#
# model_overrides:
#   organic-reviewer: opus      # Deeper reviews for a high-stakes surface
#   organic-implementer: sonnet # Cheaper implementation for a simple, well-specified project

# Custom rules for AI agents (optional)
rules:
  # Examples:
  # - "Never use default exports"
  # - "Always use server actions for mutations"
  # - "Database queries go through repository pattern"
