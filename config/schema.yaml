# config.yaml Field Reference
#
# Documents every top-level key the organic evidence-tiered delegation route
# reads from a target project's .ai-team/config.yaml, and which worker reads
# it. The canonical, annotated template lives at
# domain/skills/organic-scout/references/config-template.md — organic-scout
# writes only a subset of it verbatim on first bootstrap (project / stack /
# conventions / structure / architecture / commit_strategy; see the next
# entry below). The remaining keys in that template (strict_tdd,
# test_commands, review_gates, model_overrides, rules, retro) are optional and
# safe-absent: added by hand, or accepted via the orchestrator's Config
# Refresh Check. This file is the flat schema reference layered on top:
# keys the orchestrator reads (including at its own inline commit-creation
# step) but organic-scout does not itself write.
#
# Model routing defaults and rationale are NOT duplicated here — read
# adapters/claude-code/templates/agents/*.md and _shared/cards/delegate.md (a
# stale duplicate of that table here previously caused contract drift
# between adapters; see adapters/opencode/templates/AGENTS.md for the same
# discipline applied to the OpenCode adapter).

# project / stack / conventions / structure / architecture
#   Detected and written by organic-scout on first bootstrap (mode:
#   bootstrap). Read by every delegated worker via
#   _shared/context-protocol.md Step 1 ("Load Project Config") as project
#   conventions and declared commands.

# commit_strategy: auto | manual
#   Written by organic-scout on first bootstrap (default: auto). Read by the
#   orchestrator at its own inline commit-creation step (default: auto if
#   absent): auto commits at the objective's close without pausing; manual
#   presents the staged file set and waits for user confirmation
#   (_shared/cards/commit.md).

# model_overrides:
#   {worker-name}: {model-alias}
#   e.g.
#   model_overrides:
#     organic-reviewer: opus     # upgrade from the sonnet default
#   Project-level override of the Model Routing table's per-worker
#   defaults. Read by the orchestrator (_shared/cards/delegate.md ->
#   "Model Routing" -> "Project Override"). Worker names: organic-implementer
#   | organic-reviewer | organic-security | organic-scout | organic-retro.

# strict_tdd: true | false
#   Read by the orchestrator before delegating organic-implementer
#   (_shared/cards/delegate.md). The STRICT TDD
#   MODE directive is appended only when three conditions hold together:
#   strict_tdd: true, test_commands.unit is declared below, and the objective
#   changes behavior in a testable artifact the declared runner can exercise
#   (never prose/docs/config/templates/skill definitions). strict_tdd: true
#   with test_commands.unit absent sends no directive -- the orchestrator
#   tells the user and records the gap, never inventing a runner command.
#   organic-implementer then returns tdd_cycles evidence for each red -> green
#   cycle (see domain/skills/organic-implementer/SKILL.md -> Output Contract).

# test_commands:
#   unit: "<command>"       # the strict_tdd test runner the orchestrator cites
#   security: "<command>"   # dependency auditor, read by organic-security in
#                            # code-audit mode (organic-security/SKILL.md step 3);
#                            # absent -> "Dependency auditor: not configured (skipped)"
#   Additional project-declared build/lint commands are re-run by
#   organic-reviewer's verification lens when the phase's
#   acceptance_checks do not already cover them.

# review_gates:
#   - name: "<gate-id>"
#     command: "<command>"   # exit 0 = pass; threshold lives inside the command / project config
#     blocking: true          # optional, default true
#   Optional, safe-absent. Read by organic-reviewer (SKILL.md Step 4) alongside the phase's
#   acceptance_checks re-run. Each gate command executes as an objective assertion —
#   exit code only. A failing gate lands in `lenses.correctness.findings[]`; its `file`/`line`
#   cite this gate's own `name:`/`command:` declaration above — always resolvable. Findings
#   carry their own per-finding `confidence`; the orchestrator's downstream triage is the
#   filter, never a suppression rule at the lens (see `domain/skills/_shared/result-envelope.md`
#   -> Review Receipt). blocking: true (or blocking absent) is CRITICAL (verdict:
#   review-blocked); blocking: false is MAJOR (documents, does not block). An unrunnable gate is
#   omitted from `verification` and noted in `risks` — never fabricated pass/fail, same rule as
#   an unrunnable acceptance_checks entry. Safe-absent: no gates declared -> organic-reviewer's
#   verification re-run behaves exactly as before this key existed. Calibration guidance for
#   whoever hand-adds a gate (run against a known-failing state first, run twice to rule out a
#   cached green, never accept a zero-work result as passing) is NOT duplicated here — this
#   file's own header disclaimer names domain/skills/organic-scout/references/config-template.md
#   as the canonical, annotated source; read the calibration note there.

# retro: always | on-signal | off
#   Optional, safe-absent default: on-signal. Read by the orchestrator when `ai-team close` flips a task to
#   `done` (domain/skills/_shared/cards/close.md):
#   always delegates organic-retro (mode: retro) unconditionally; on-signal delegates only when
#   the task raised >=1 signal (>=2 attempts on a phase, an infra-death, a review-blocked
#   verdict, or a single ticket above 300k tokens); off never delegates it. Canonical annotated
#   source: domain/skills/organic-scout/references/config-template.md.

# rules:
#   - "<constraint>"
#   Optional, safe-absent. Free-text custom rules for AI agents, added by
#   hand (not written by scout bootstrap). Read by every delegated worker
#   via _shared/context-protocol.md Step 1 ("Load Project Config") alongside
#   `conventions`.
